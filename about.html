<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Stanislaus</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dfeeff, #f5f9ff);
        color: #10273d;
      }
      .card {
        background: white;
        border-radius: 20px;
        padding: 40px 50px;
        box-shadow: 0 18px 36px rgba(47, 96, 170, 0.15);
        text-align: center;
        width: min(700px, 90%);
      }
      h1 { color: #0f3a68; margin-bottom: 20px; }
      p { font-size: 1.3rem; margin: 12px 0; }
      .favorite { color: blue; font-weight: bold; }
      .button {
        display: inline-block;
        margin-top: 20px;
        text-decoration: none;
        background: #2d7ff9;
        color: white;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>About Me</h1>
      <p>Date of Birth: 16 July 1995</p>
      <p>Favorite Color: <span class="favorite">Blue</span></p>
      <a class="button" href="index.html">Back to Home</a>
    </div>
  </body>
</html>
