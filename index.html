<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Stanislaus</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0f0ff, #f9fbff);
        color: #123;
      }
      .card {
        background: rgba(255,255,255,0.9);
        border-radius: 20px;
        padding: 48px 56px;
        box-shadow: 0 20px 40px rgba(31, 85, 157, 0.18);
        text-align: center;
        max-width: 700px;
        width: 90%;
      }
      h1 {
        font-size: clamp(2.3rem, 4vw, 4rem);
        margin: 0 0 24px;
        color: #0d3b66;
      }
      .button {
        display: inline-block;
        text-decoration: none;
        background: linear-gradient(135deg, #2d7ff9, #5aa7ff);
        color: white;
        padding: 14px 28px;
        border-radius: 999px;
        font-weight: bold;
        transition: transform 0.2s ease;
      }
      .button:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello, Stanislaus!</h1>
      <a class="button" href="about.html">Enter profile</a>
    </div>
  </body>
</html>
